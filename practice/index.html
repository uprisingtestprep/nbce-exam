<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NBCE Part IV Practice Tool</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="gate" class="screen">
  <div class="card center">
    <h1>NBCE Part IV Practice Tool</h1>
    <p class="muted">Timed encounters and technique station</p>
    <p>Enter your access code to begin</p>
    <input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="Access code" />
    <button id="code-btn" class="btn">Start</button>
    <p id="code-err" class="err"></p>
  </div>
</div>
<div id="app" class="screen" style="display:none"></div>
<script src="app.js"></script>
</body>
</html>
